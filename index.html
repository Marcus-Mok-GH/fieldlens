<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>FieldLens — point your camera and learn what you see</title>
        <meta
            name="description"
            content="FieldLens reads the photo on your phone and explains what it is and what to look for, using Pollinations vision, image and audio models. You pay from your own balance."
        />
        <meta name="theme-color" content="#0d1210" />
        <meta name="color-scheme" content="dark" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="styles.css" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/@pollinations/ui@0.1.0-alpha.41/dist/connect.js"
        ></script>
    </head>
    <body class="mode-capture">
        <header class="topbar">
            <a class="brand" href="./">
                <svg
                    class="brand-mark"
                    viewBox="0 0 32 32"
                    aria-hidden="true"
                    focusable="false"
                >
                    <circle
                        cx="16"
                        cy="16"
                        r="11.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                    />
                    <path
                        d="M20.5 11.5c-4.6-.6-8 1.6-8.6 6.1-.3 2.4.7 4 2.3 4.6 2.1.8 4.6-.4 5.9-2.6 1-1.8.9-4 .4-8.1Z"
                        fill="currentColor"
                    />
                    <path
                        d="M12 21c2.6-3.4 5.2-6 8.2-8"
                        fill="none"
                        stroke="var(--bg)"
                        stroke-width="1.6"
                        stroke-linecap="round"
                    />
                </svg>
                <span class="brand-name">FieldLens</span>
            </a>
            <div class="topbar-right">
                <span class="balance" id="balance" hidden></span>
                <polli-connect
                    id="connect"
                    app-key="pk_REPLACE_ME"
                    budget="5"
                    expiry="30"
                    models="text,image,audio"
                    permissions="usage"
                    menu-links='[{"label":"Quests","href":"https://enter.pollinations.ai/quests","icon":"app"}]'
                ></polli-connect>
            </div>
        </header>

        <main class="main">
            <section class="capture" id="capture">
                <div class="stage" id="stage">
                    <video
                        id="preview"
                        playsinline
                        muted
                        autoplay
                        aria-label="Live camera preview"
                    ></video>
                    <img id="still" alt="" hidden />
                    <div class="stage-frame" aria-hidden="true"></div>

                    <div class="stage-veil" id="stage-veil">
                        <p class="veil-title" id="veil-title">
                            Point your camera at something
                        </p>
                        <p class="veil-note" id="veil-note">
                            A plant, a rock, a bird, a dish, a building — FieldLens
                            names it and tells you what to look for.
                        </p>
                    </div>

                    <div
                        class="focus-strip"
                        id="focus-strip"
                        role="group"
                        aria-label="What to focus on"
                    ></div>
                </div>

                <div class="controls">
                    <button
                        class="ctl"
                        id="upload-btn"
                        type="button"
                        aria-label="Upload a photo from your device"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linejoin="round"
                            />
                            <circle
                                cx="12"
                                cy="13"
                                r="3.4"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />
                        </svg>
                        <span>Photo</span>
                    </button>

                    <button
                        class="shutter"
                        id="shutter"
                        type="button"
                        aria-label="Identify this photo"
                    >
                        <span class="shutter-ring"></span>
                        <span class="shutter-core"></span>
                    </button>

                    <button
                        class="ctl"
                        id="flip-btn"
                        type="button"
                        aria-label="Switch between the front and back camera"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M9.5 13.5a3 3 0 0 1 4.7-2.4M14.5 13.5a3 3 0 0 1-4.7 2.4"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />
                            <path
                                d="M14 9.5v2h-2M10 16.5v-2h2"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <span>Flip</span>
                    </button>
                </div>

                <input
                    type="file"
                    id="file-input"
                    accept="image/*"
                    capture="environment"
                    hidden
                />
            </section>

            <section class="result" id="result" hidden>
                <figure class="shot">
                    <img id="shot-img" alt="The photo you analysed" />
                    <figcaption id="shot-focus">Auto</figcaption>
                </figure>

                <article class="guide" id="guide">
                    <h1 id="guide-title">…</h1>
                    <div class="prose" id="guide-body"></div>
                    <div class="look" id="guide-look" hidden>
                        <h2>Look for</h2>
                        <ul id="guide-look-list"></ul>
                    </div>
                </article>

                <figure class="plate" id="plate" hidden>
                    <img
                        id="plate-img"
                        alt="Field guide illustration of what you photographed"
                    />
                    <figcaption>
                        Drawn by a Pollinations image model from the field notes
                    </figcaption>
                </figure>

                <div class="actions">
                    <button class="pill" id="illustrate-btn" type="button">
                        Illustrate
                    </button>
                    <button class="pill" id="speak-btn" type="button">
                        Read aloud
                    </button>
                    <button class="pill ghost" id="again-btn" type="button">
                        New photo
                    </button>
                </div>

                <section class="chat">
                    <div class="chat-log" id="chat-log"></div>
                    <form class="chat-form" id="chat-form">
                        <input
                            id="chat-input"
                            type="text"
                            placeholder="Ask a follow-up about this photo"
                            autocomplete="off"
                            enterkeyhint="send"
                        />
                        <button type="submit" aria-label="Send question">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M12 19V5M6 11l6-6 6 6"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </button>
                    </form>
                </section>
            </section>
        </main>

        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

        <footer class="footer">
            <a
                href="https://pollinations.ai/?ref=badge"
                target="_blank"
                rel="noopener"
            >
                <img
                    src="https://raw.githubusercontent.com/pollinations/pollinations/main/packages/ui/src/brand/badge-made-with.svg"
                    alt="Made with pollinations.ai"
                    width="150"
                    height="32"
                />
            </a>
            <p>
                Vision, image and speech by
                <a
                    href="https://gen.pollinations.ai/models"
                    target="_blank"
                    rel="noopener"
                    >Pollinations</a
                >. You pay from your own Pollinations balance.
            </p>
        </footer>

        <script src="app.js" type="module"></script>
    </body>
</html>
